version: "3.9"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${database}"
      MYSQL_USER: "${user}"
      MYSQL_PASSWORD: "${password}"
      MYSQL_ROOT_PASSWORD: "${password}"
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  dashboard:
    build: .
    restart: unless-stopped
    env_file:
      - Dashboard_Waternet_Streamlit/.env   # <-- keep credentials outside the image
    depends_on:
      - db
    ports:
      - "8501:8501"

volumes:
  dbdata:
